appId: com.flowreader.app
productName: FlowReader
directories:
  buildResources: build
  output: release
files:
  - dist
  - dist-electron
  - LICENSE
  - THIRD-PARTY-NOTICES.md
  # Optional native canvas pulled in by pdfjs-dist; the app does not use it.
  - "!node_modules/@napi-rs/**"
# Also place the license files next to the app, where users can read them.
extraResources:
  - LICENSE
  - THIRD-PARTY-NOTICES.md
win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: FlowReader
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  target: dmg
  icon: build/icon.png
linux:
  target: AppImage
  icon: build/icon.png
