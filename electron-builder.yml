appId: com.flowreader.app
productName: FlowReader
directories:
  buildResources: build
  output: release
files:
  - dist
  - dist-electron
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  icon: build/icon.icns
linux:
  target: AppImage
  icon: build/icon.png
